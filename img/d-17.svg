xt><path d="M530.0 230v18" stroke="#8a8a85" stroke-width="2.5" marker-end="url(#ah)"/><rect x="402" y="252" width="256" height="48" rx="8" fill="#1d1d1d" stroke="#3ddc97" stroke-opacity=".5"/><text x="420" y="284" font-size="19" fill="#f4f4f0">Homing</text><path d="M530.0 304v18" stroke="#8a8a85" stroke-width="2.5" marker-end="url(#ah)"/><rect x="402" y="326" width="256" height="48" rx="8" fill="#1d1d1d" stroke="#3ddc97" stroke-opacity=".5"/><text x="420" y="358" font-size="19" fill="#f4f4f0">Square</text><path d="M530.0 378v18" stroke="#8a8a85" stroke-width="2.5" marker-end="url(#ah)"/><rect x="402" y="400" width="256" height="48" rx="8" fill="#1d1d1d" stroke="#3ddc97" stroke-opacity=".5"/><text x="420" y="432" font-size="19" fill="#f4f4f0">Rounded square</text><path d="M530.0 452v18" stroke="#8a8a85" stroke-width="2.5" marker-end="url(#ah)"/><rect x="402" y="474" width="256" height="48" rx="8" fill="#1d1d1d" stroke="#3ddc97" stroke-opacity=".5"/><text x="420" y="506" font-size="19" fill="#f4f4f0">Manual</text><path d="M686 430h28" stroke="#8a8a85" stroke-width="3" marker-end="url(#ah)"/><text x="720" y="78" font-size="26" font-weight="700" letter-spacing="2" fill="#ff3358">03 MOTION</text><text x="720" y="108" font-size="19" fill="#8a8a85">function blocks</text><rect x="720" y="150" width="300" height="560" rx="12" fill="#151515" stroke="#2a2a2a"/><rect x="742" y="178" width="256" height="48" rx="8" fill="#1d1d1d" stroke="#ff3358" stroke-opacity=".5"/><text x="760" y="210" font-size="19" fill="#f4f4f0">Axis control</text><path d="M870.0 230v18" stroke="#8a8a85" stroke-width="2.5" marker-end="url(#ah)"/><rect x="742" y="252" width="256" height="48" rx="8" fill="#1d1d1d" stroke="#ff3358" stroke-opacity=".5"/><text x="760" y="284" font-size="19" fill="#f4f4f0">2D move</text><path d="M870.0 304v18" stroke="#8a8a85" stroke-width="2.5" marker-end="url(#ah)"/><rect x="742" y="326" width="256" height="48" rx="8" fill="#1d1d1d" stroke="#ff3358" stroke-opacity=".5"/><text x