<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace"><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#262626"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8a85"/></marker></defs><rect width="1400" height="760" rx="18" fill="#0d0d0d"/><rect width="1400" height="760" rx="18" fill="url(#dots)"/><text x="40" y="78" font-size="26" font-weight="700" letter-spacing="2" fill="#4ea1ff">01 BEFORE</text><text x="40" y="108" font-size="19" fill="#8a8a85">manual entry</text><rect x="40" y="150" width="300" height="560" rx="12" fill="#151515" stroke="#2a2a2a"/><text x="62" y="218" font-size="44" font-weight="700" fill="#f4f4f0">~25</text><text x="62" y="246" font-size="18" fill="#4ea1ff">fields typed per claim</text><text x="62" y="286" font-size="17" fill="#8a8a85">old vision step: 71 crops</text><text x="62" y="312" font-size="17" fill="#8a8a85">per page at 2.65 s each</text><path d="M346 430h28" stroke="#8a8a85" stroke-width="3" marker-end="url(#ah)"/><text x="380" y="78" font-size="26" font-weight="700" letter-spacing="2" fill="#3ddc97">02 READ</text><text x="380" y="108" font-size="19" fill="#8a8a85">no images to AI</text><rect x="380" y="150" width="300" height="560" rx="12" fill="#151515" stroke="#2a2a2a"/><rect x="402" y="178" width="256" height="48" rx="8" fill="#1d1d1d" stroke="#3ddc97" stroke-opacity=".5"/><text x="420" y="210" font-size="19" fill="#f4f4f0">Portal sync</text><path d="M530.0 230v18" stroke="#8a8a85" stroke-width="2.5" marker-end="url(#ah)"/><rect x="402" y="252" width="256" height="72" rx="8" fill="#1d1d1d" stroke="#3ddc97" stroke-opacity=".5"/><text x="420" y="284" font-size="19" fill="#f4f4f0">GPU OCR</text><text x="420" y="308" font-size="16" fill="#8a8a85">PaddleOCR → markdown</text><path d="M530.0 328v18" stroke="#8a8a85" stroke-width="2.5" marker-end="url(#ah)"/><rect x="402" y="350" width="256" height="96" rx="8" fill="#3ddc97" fill-opacity=".14" stroke="#3ddc97"/><text x="420" y="382" font-size="19" fill="#f4f4f0" font-weight="700">Text-only AI</text><text x="420" y="406" font-size="16" fill="#8a8a85">answers must be on</text><text x="420" y="430" font-size="16" fill="#8a8a85">page</text><path d="M686 430h28" stroke="#8a8a85" stroke-width="3" marker-end="url(#ah)"/><text x="720" y="78" font-size="26" font-weight="700" letter-spacing="2" fill="#ff3358">03 GATE</text><text x="720" y="108" font-size="19" fill="#8a8a85">unsupervised</text><rect x="720" y="150" width="300" height="560" rx="12" fill="#151515" stroke="#2a2a2a"/><rect x="742" y="178" width="256" height="96" rx="8" fill="#1d1d1d" stroke="#ff3358" stroke-opacity=".5"/><text x="760" y="210" font-size="19" fill="#f4f4f0">Fuzzy matching</text><text x="760" y="234" font-size="16" fill="#8a8a85">doctor + hospital, no</text><text x="760" y="258" font-size="16" fill="#8a8a85">AI</text><path d="M870.0 278v18" stroke="#8a8a85" stroke-width="2.5" marker-end="url(#ah)"/><rect x="742" y="300" width="256" height="48" rx="8" fill="#1d1d1d" stroke="#ff3358" stroke-opacity=".5"/><text x="760" y="332" font-size="19" fill="#f4f4f0">Completeness gate</text><path d="M870.0 352v18" stroke="#8a8a85" stroke-width="2.5" marker-end="url(#ah)"/><rect x="742" y="374" width="256" height="72" rx="8" fill="#1d1d1d" stroke="#ff3358" stroke-opacity=".5"/><text x="760" y="406" font-size="19" fill="#f4f4f0">Auto-send</text><text x="760" y="430" font-size="16" fill="#8a8a85">or human queue</text><path d="M1026 430h28" stroke="#8a8a85" stroke-width="3" marker-end="url(#ah)"/><text x="1060" y="78" font-size="26" font-weight="700" letter-spacing="2" fill="#ffc247">04 RESULT</text><text x="1060" y="108" font-size="19" fill="#8a8a85">vs 109 human claims</text><rect x="1060" y="150" width="300" height="560" rx="12" fill="#151515" stroke="#2a2a2a"/><text x="1082" y="194" font-size="16" fill="#8a8a85">wrong doctor matches (auto-</text><text x="1082" y="218" font-size="16" fill="#8a8a85">sent)</text><text x="1082" y="248" font-size="17" fill="#f4f4f0">before 21 of 80</text><rect x="1082" y="258" width="256.0" height="18" rx="3" fill="#ffc247" opacity="0.45"/><text x="1082" y="306" font-size="17" fill="#f4f4f0">after 4 of 69</text><rect x="1082" y="316" width="56.5" height="18" rx="3" fill="#ffc247" opacity="1"/><text x="1082" y="376" font-size="17" fill="#8a8a85">hold mode is the default</text></svg>
